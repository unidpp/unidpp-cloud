name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: unidpp-cloud
      # The wasm boundary resolves the sibling crates and the
      # path-included projector/gateway sources at the family's
      # sibling layout — the same depth the local checkout keeps.
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-core
          path: unidpp-core
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-signatif
          path: unidpp-signatif
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-cli
          path: unidpp-cli
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-projector
          path: unidpp-projector
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-gateway
          path: unidpp-gateway
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the wasm boundary
        run: |
          cargo build --manifest-path unidpp-cloud/wasm/core/Cargo.toml --target wasm32-unknown-unknown --release
          cp unidpp-cloud/wasm/core/target/wasm32-unknown-unknown/release/unidpp_core_wasm.wasm unidpp-cloud/src/core_bg.wasm
      - name: Install and test
        working-directory: unidpp-cloud
        run: |
          npm install
          npx tsc --noEmit
          npx vitest run
